name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: trazalia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d trazalia"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://trazalia_app:app_dev@localhost:5432/trazalia_test
      DATABASE_URL_MIGRACIONES: postgresql://trazalia_migrador:migrador_dev@localhost:5432/trazalia_test
      ORIGEN_WEB: http://localhost:4200
      # Par de claves EdDSA solo para CI (DP-11); no es secreto de producción.
      JWT_ACCESS_CLAVE_PRIVADA: eyJrdHkiOiJPS1AiLCJjcnYiOiJFZDI1NTE5IiwieCI6Ii1RdkxEN3Z3TDBXTzVpUDhXbW03RGlvVzlMSzRyTk10bnlKYU9GYkQ3M0EiLCJkIjoiamVMSzFKNEJEYmdaVG9tM2U4aFZMQ0UxTml5TEVpRnZUWGlMR0RfU0hOdyJ9
      JWT_ACCESS_CLAVE_PUBLICA: eyJrdHkiOiJPS1AiLCJjcnYiOiJFZDI1NTE5IiwieCI6Ii1RdkxEN3Z3TDBXTzVpUDhXbW03RGlvVzlMSzRyTk10bnlKYU9GYkQ3M0EifQ
      JWT_REFRESH_CLAVE_PRIVADA: eyJrdHkiOiJPS1AiLCJjcnYiOiJFZDI1NTE5IiwieCI6IjV3S2U0NkNPdDk1UzJFUGZRNWo0MTlMTXpnblZhVzJVZV9wRnFiY3hFVlkiLCJkIjoiWm1kanQyWWtfbC1LZkMxR1F2c1VObTVRVnh6SkYxbXQwTE91S18wX2dGdyJ9
      JWT_REFRESH_CLAVE_PUBLICA: eyJrdHkiOiJPS1AiLCJjcnYiOiJFZDI1NTE5IiwieCI6IjV3S2U0NkNPdDk1UzJFUGZRNWo0MTlMTXpnblZhVzJVZV9wRnFiY3hFVlkifQ
      # Umbral bajo para que las pruebas de bloqueo (BR-035) sean rápidas; límite
      # de IP alto para que no choque con el rate limiting (otra preocupación).
      BLOQUEO_UMBRAL_INTENTOS: 3
      RATE_LIMIT_MAXIMO: 1000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run prisma:generar

      - name: Formato
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas unitarias con cobertura
        run: npm run test:cov

      - name: Roles y esquemas de PostgreSQL
        env:
          PGPASSWORD: postgres_ci
        run: psql -h localhost -U postgres -d trazalia -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles-y-esquemas.sql
      - name: Migraciones
        run: npm run prisma:desplegar
      - name: Pruebas e2e contra PostgreSQL
        run: npm run test:e2e

      - name: Build
        run: npm run build

  imagen:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
