# Infraestructura local de desarrollo y pruebas. No usar estas credenciales fuera de tu máquina.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: trazalia
    ports:
      - '5432:5432'
    volumes:
      - datos-postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trazalia']
      interval: 5s
      timeout: 3s
      retries: 10

  # Bandeja de correo local: SMTP en 1025, interfaz web en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  datos-postgres:
