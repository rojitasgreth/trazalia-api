# Blueprint del entorno de calidad en Render (plan gratis). Los valores con
# "sync: false" son secretos: Render los pide al crear el Blueprint y no viven
# en el repositorio. Guía paso a paso: docs/despliegue-calidad.md
services:
  - type: web
    name: trazalia-calidad
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile.calidad
    # La página principal no consulta la base: así ni este chequeo ni el ping
    # externo despiertan a Neon, cuyo plan gratis da 100 horas de cómputo al mes.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUERTO
        value: '10000'
      - key: CONFIAR_PROXY
        value: 'true'
      - key: ZONA_HORARIA_NEGOCIO
        value: America/Caracas
      # URL pública del servicio, p. ej. https://trazalia-calidad.onrender.com
      - key: ORIGEN_WEB
        sync: false
      # Neon: rol trazalia_app (aplicación) y rol trazalia_migrador (migraciones).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_MIGRACIONES
        sync: false
      # Generar un par nuevo para este entorno: npm run jwt:generar-claves
      - key: JWT_ACCESS_CLAVE_PRIVADA
        sync: false
      - key: JWT_ACCESS_CLAVE_PUBLICA
        sync: false
      - key: JWT_REFRESH_CLAVE_PRIVADA
        sync: false
      - key: JWT_REFRESH_CLAVE_PUBLICA
        sync: false
      # Render gratis bloquea los puertos SMTP de salida: el correo va por la
      # API HTTPS de Brevo (SMTP & API → API Keys).
      - key: BREVO_API_KEY
        sync: false
      # Remitente verificado en Brevo, p. ej. "Trazalia <tu-correo@gmail.com>"
      - key: CORREO_REMITENTE
        sync: false
